<header>
  <div class="mark" aria-hidden="true"></div>

  <h1 class="masthead__name">{{ site.title }}</h1>
  <p class="masthead__ko" lang="ko">{{ site.author.name_ko }}</p>
  <p class="masthead__role">{{ site.tagline }}</p>

  <hr class="rule">

  <div class="band">
    <div class="band__label">pages</div>
    <nav>
      <ul class="nav">
        {% for item in site.nav %}
          <li>
            <a href="{{ item.url | relative_url }}"
               {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.title }}</a>
          </li>
        {% endfor %}
      </ul>
    </nav>
  </div>

  <hr class="rule">
</header>
